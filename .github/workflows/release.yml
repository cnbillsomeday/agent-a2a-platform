name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64, suffix: linux-amd64 }
          - { goos: linux,  goarch: arm64, suffix: linux-arm64 }
          - { goos: darwin, goarch: arm64, suffix: darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags '-s -w' -o "$GITHUB_WORKSPACE/a2a-server-${{ matrix.suffix }}" ./cmd/a2a-server

      - name: checksum
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum "a2a-server-${{ matrix.suffix }}" > "a2a-server-${{ matrix.suffix }}.sha256"
          cat "a2a-server-${{ matrix.suffix }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: a2a-server-${{ matrix.suffix }}
          path: |
            a2a-server-${{ matrix.suffix }}
            a2a-server-${{ matrix.suffix }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: list
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## 部署

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd $(basename ${{ github.repository }})
            sudo bash deploy/install.sh --domain a2a.example.com --repo ${{ github.repository }}
            ```

            或手动下载对应架构的二进制：

            ```bash
            curl -fLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/a2a-server-linux-amd64
            chmod +x a2a-server-linux-amd64
            ./a2a-server-linux-amd64 -addr 127.0.0.1:21220 -dir ./data -domain a2a.example.com
            ```
